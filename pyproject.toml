[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dietly-mcp"
version = "0.1.0"
description = "Unofficial Dietly (dietly.pl) API client and debug CLI. F1 of a future MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pawel" }]
keywords = ["dietly", "api", "cli", "mcp", "meal-selection"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dietly-mcp = "dietly_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dietly_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM", "C4", "RET", "PT"]
